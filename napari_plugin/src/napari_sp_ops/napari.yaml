name: napari-sp-ops
display_name: napari sp-ops
contributions:
  commands:
    - id: napari-sp-ops.get_reader
      title: Open an sp-ops store
      python_name: napari_sp_ops._reader:napari_get_reader
    - id: napari-sp-ops.navigator
      title: Open the sp-ops navigator
      python_name: napari_sp_ops._widget:SpOpsNavigator
  readers:
    - command: napari-sp-ops.get_reader
      filename_patterns: ["*.zarr", "*.zarr*"]
      accepts_directories: true
  widgets:
    - command: napari-sp-ops.navigator
      display_name: sp-ops navigator
